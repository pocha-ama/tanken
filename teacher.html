<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>探検ゲーム 教員用</title>
<style>
:root{--bg:#F4EDE1;--card:#FFFBF4;--ink:#2A2119;--sub:#6B5B4B;--accent:#B5532A;--accent2:#2E6B6E;--line:#E2D5C1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 6px}
h2{font-size:22px;margin:32px 0 10px}
p{line-height:1.7;margin:0 0 10px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:0;border-radius:10px;padding:12px 20px;font-size:17px;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.qrbox{display:flex;gap:32px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
#qr{background:#fff;padding:16px;border-radius:12px}
#qr img,#qr canvas{display:block}
.big{font-size:30px;font-weight:800;margin:0 0 8px}
.url{font-size:18px;word-break:break-all;color:var(--accent2);font-weight:700}
.map{font-size:20px;line-height:1.9}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:12px;overflow:hidden;font-size:16px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{background:#EDE3D1}
td.n,th.n{text-align:right}
td:nth-child(1),td:nth-child(2),th:nth-child(1),th:nth-child(2),td:nth-child(3),th:nth-child(3){white-space:nowrap}
.note{font-size:14px;color:var(--sub)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;font-weight:700;background:#EDE3D1}
.tag.best{background:#D7E8E6;color:var(--accent2)}
details{margin-top:32px}
summary{font-size:22px;font-weight:700;cursor:pointer}
.tag.risky{background:#F3D9CF;color:#A3361F}
</style>
</head>
<body>
<div class="wrap">
  <h1>探検ゲーム 教員用ページ</h1>
  <p class="note">このページは学生には見せない部分も含みます。QRコードを映すときは、このページを全画面にして該当部分だけを見せてください。</p>

  <div class="tabs">
    <button id="t1" class="on">1回目のQRコード</button>
    <button id="t2">2回目のQRコード</button>
  </div>

  <div class="qrbox">
    <div id="qr"></div>
    <div>
      <p class="big" id="qtitle">探検 1回目</p>
      <p class="url" id="qurl"></p>
      <div class="map" id="qmap"></div>
    </div>
  </div>

  <details>
    <summary>種明かし用：各場所の本当の設定（クリックで開く）</summary>
    <p class="note" style="margin-top:10px">学生の画面では、場所の並び順は一人ひとりランダムです。</p>
    <div id="truth"></div>
  </details>

  <h2>集計の見方</h2>
  <p>フォームの「回答」タブの概要で、「次に来る人へのおすすめ」のグラフをそのまま映せば、2回目の前に見せる「先にこの土地を探検した人たちのおすすめ」になります。場所の名前は草原と川辺で重ならないので、1つのグラフで両方の土地のおすすめが分かります。</p>
</div>

<script src="qrcode.js"></script>
<script>
const base = new URL("index.html", location.href).href;
const MAP = {
  1: "<b>左側</b> → 草原<br><b>右側</b> → 川辺",
  2: "<b>左側</b> → 川辺（6回目から乾季）<br><b>右側</b> → 草原（変化なし）"
};
function show(r){
  const url = base + "?r=" + r;
  document.getElementById("t1").classList.toggle("on", r === 1);
  document.getElementById("t2").classList.toggle("on", r === 2);
  document.getElementById("qtitle").textContent = "探検 " + r + "回目";
  document.getElementById("qurl").textContent = url;
  document.getElementById("qmap").innerHTML = MAP[r];
  const box = document.getElementById("qr");
  box.innerHTML = "";
  if (window.qrcode){
    const q = qrcode(0, "M");
    q.addData(url);
    q.make();
    box.innerHTML = q.createSvgTag({cellSize: 10, margin: 0, scalable: true});
    const svg = box.querySelector("svg");
    svg.setAttribute("width", "380"); svg.setAttribute("height", "380");
  } else {
    box.textContent = "QRコードを表示できません。qrcode.js が同じフォルダにあるか確認してください。";
  }
}
document.getElementById("t1").onclick = () => show(1);
document.getElementById("t2").onclick = () => show(2);
show(1);

const ROWS = [
  ["草原", "赤い岩の茂み", "best",  "カンガルー40%／オオトカゲ20%／なし35%／毒ヘビ5%", "+1.2"],
  ["草原", "枯れ木の茂み", "mid",   "カンガルー10%／オオトカゲ50%／なし35%／毒ヘビ5%", "+0.6"],
  ["草原", "アリ塚の茂み", "mid",   "カンガルー10%／オオトカゲ50%／なし35%／毒ヘビ5%", "+0.6"],
  ["草原", "白い花の茂み", "risky", "カンガルー50%／なし20%／毒ヘビ30%", "0.0"],
  ["川辺", "倒木のかげ",   "best",  "カモ40%／魚20%／なし35%／ワニ5%（2回目の6回目以降：カモ5%／魚25%／なし65%／ワニ5%）", "+1.2（変化後 +0.15）"],
  ["川辺", "ユーカリの根元","mid",  "カモ10%／魚50%／なし35%／ワニ5%（2回目の6回目以降：カモ40%／魚20%／なし35%／ワニ5%）", "+0.6（変化後 +1.2）"],
  ["川辺", "砂の浅瀬",     "mid",   "カモ10%／魚50%／なし35%／ワニ5%", "+0.6"],
  ["川辺", "葦の茂み",     "risky", "カモ50%／なし20%／ワニ30%", "0.0"]
];
const LABEL = {best:"いちばん良い", mid:"ふつう（同じ設定が2か所）", risky:"大物も危険も多い"};
document.getElementById("truth").innerHTML = `
  <table>
    <tr><th>土地</th><th>場所</th><th>役割</th><th>出てくるもの</th><th class="n">1回あたりの平均点</th></tr>
    ${ROWS.map(r => `<tr><td>${r[0]}</td><td><b>${r[1]}</b></td><td><span class="tag ${r[2]}">${LABEL[r[2]]}</span></td><td>${r[3]}</td><td class="n">${r[4]}</td></tr>`).join("")}
  </table>
  <p class="note" style="margin-top:8px">点数：カンガルー・カモ＋3／オオトカゲ・魚＋1／なし0／毒ヘビ・ワニ－5。</p>`;
</script>
</body>
</html>
